[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-intelligence"
version = "0.1.0"
description = "Privacy-aware email intelligence platform — hybrid rules + local embeddings categorization."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Karan Tandra" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The local embedding model. Heavy (pulls torch); kept optional so tests/CI can
# run with the deterministic hashing fallback. Install with: pip install -e "backend[ml]"
ml = ["sentence-transformers>=2.7"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Synthetic email fixtures contain realistic long body copy; wrapping it would hurt readability.
"app/ingest/demo.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
